# Builds a versioned build-artifact image of PuntersScraper.Web (NOT a runnable production
# container - see deploy/Dockerfile.web for why). VERSION is read from the repo-root VERSION file
# (shared with the App - see installer/release.bat) by deploy/docker-build.ps1, which sets it as
# an environment variable before calling `docker compose build`; running `docker compose build`
# directly falls back to 0.0.0.
#
# Usage:
#     powershell deploy/docker-build.ps1

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VERSION: ${VERSION:-0.0.0}
    image: puntersscraper-web:${VERSION:-0.0.0}

  # Local-dev RabbitMQ for testing the "meeting.scraped" event publishing (see the App's
  # RabbitMqMeetingEventPublisher and docs/prompts/rabbitmq-meeting-events*.md). Not part of the
  # build-artifact pipeline above — start it on its own with `docker compose up rabbitmq`. The
  # management UI is at http://localhost:15672 (guest/guest) for inspecting the exchange/queues.
  rabbitmq:
    image: rabbitmq:4.3-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
